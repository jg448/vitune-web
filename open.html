<!doctype html><html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Einladung – Vitune</title><link rel="icon" href="vito.png">
<style>
:root{--bg:#f4f6f5;--card:#fff;--text:#14201c;--muted:#5b6b66;--accent:#13705a}
@media (prefers-color-scheme:dark){:root{--bg:#0e1513;--card:#16201d;--text:#e8efec;--muted:#9fb1ab;--accent:#5fd3a8}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:460px;margin:32px auto;padding:28px 20px;background:var(--card);border-radius:22px;text-align:center}
@media (max-width:500px){main{margin:16px}}
img{width:150px}h1{font-size:24px;margin:8px 0}.code{font:800 34px/1.2 ui-monospace,Menlo,monospace;letter-spacing:3px;margin:14px 0}
a.btn{display:block;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;padding:14px;border-radius:14px;margin-top:16px}
p{color:var(--muted)}
</style></head>
<body><main>
<img src="vito.png" alt="Vito, der Vitune-Fuchs">
<h1 id="t">Einladung zu Vitune</h1>
<p id="d">Öffne die Einladung in der Vitune-App.</p>
<div class="code" id="c"></div>
<a class="btn" id="open" href="#">In Vitune öffnen</a>
<p style="font-size:14px;margin-top:18px">Noch keine App? Vitune ist bald im App Store. Den Code kannst du in der App auch von Hand eingeben.</p>
</main>
<script>
const q = new URLSearchParams(location.search);
const raw = (q.get("f") || q.get("c") || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 12);
const isFriend = q.has("f");
document.getElementById("c").textContent = raw;
document.getElementById("t").textContent = isFriend ? "Freundschaftsanfrage 🦊" : "Challenge-Einladung 🏆";
document.getElementById("d").textContent = isFriend
  ? "Jemand möchte mit dir in Vitune befreundet sein."
  : "Du wurdest zu einer Vitune-Challenge eingeladen.";
const url = "vitune://" + (isFriend ? "friend/" : "join/") + raw;
document.getElementById("open").href = url;
if (raw) setTimeout(() => { location.href = url; }, 300);
</script>
</body></html>
